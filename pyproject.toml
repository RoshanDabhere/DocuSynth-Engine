[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docusynth-engine"
version = "0.1.0"
description = "A production-style document question-answering RAG application."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyJWT>=2.10,<3.0",
    "PyMuPDF>=1.26,<2.0",
    "aiofiles>=24.1,<26.0",
    "bcrypt>=4.3,<6.0",
    "chardet>=5.2,<6.0",
    "fastapi>=0.116,<1.0",
    "email-validator>=2.2,<3.0",
    "langchain-community>=0.4,<1.0",
    "langchain-huggingface>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "ollama>=0.6,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "qdrant-client>=1.15,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "sentence-transformers>=5.0,<6.0",
    "tiktoken>=0.11,<1.0",
    "torch>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
