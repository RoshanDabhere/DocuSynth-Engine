[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docusynth-engine"
version = "0.1.0"
description = "A production-style document question-answering RAG application."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
