<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | DocuSynth</title><link rel="stylesheet" href="../css/styles.css"></head>
<body class="auth-page" data-page="register">
  <main class="auth-card">
    <div class="brand"><span class="brand-mark">D</span> DocuSynth</div>
    <h1>Create account</h1><p class="muted">Build your private document knowledge space.</p>
    <p id="form-message" class="form-message" role="alert"></p>
    <form id="register-form" class="form-stack">
      <label>Name<input type="text" name="name" placeholder="Your name" required></label>
      <label>Email<input type="email" name="email" placeholder="you@example.com" required></label>
      <label>Password<input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></label>
      <button class="button" type="submit" data-label="Create account">Create account</button>
    </form>
    <p class="auth-switch muted">Already registered? <a href="login.html">Sign in</a></p>
  </main>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
